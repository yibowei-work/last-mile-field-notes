name: Daily intelligence refresh (Codex-managed)

on:
  # Collection is run by the local Codex scheduled task at 08:30 Asia/Shanghai.
  # Keep this workflow manual-only so it never calls a paid OpenAI API.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codex-managed-notice:
    runs-on: ubuntu-latest
    steps:
      - name: Explain the active refresh path
        run: |
          echo "Intelligence collection is maintained by the local Codex scheduled task."
          echo "Verified changes are pushed to main, and deploy.yml publishes GitHub Pages."
          echo "No OPENAI_API_KEY or paid Responses API call is used by this workflow."
